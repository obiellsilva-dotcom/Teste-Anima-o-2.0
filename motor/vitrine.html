<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vitrine de personagem</title>
<link rel="icon" href="data:,">
<script>addEventListener("error", e => { window.__erroFatal = e.message; }); addEventListener("unhandledrejection", e => { window.__erroFatal = String(e.reason && e.reason.message || e.reason); });</script>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
  #gl { display: none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<!-- O primeiro canvas é o gravado (2D: fundo + 3D composto). -->
<canvas id="tela"></canvas>
<canvas id="gl"></canvas>
<script type="module">
// Vitrine: mostra um personagem em fundo neutro, iluminação de estúdio.
// Parâmetros:
//   personagem=senhor            (carrega personagens/<nome>/<nome>.js)
//   expressao=feliz              (padrão: a da pose, senão a da ficha)
//   pose=parado                  (poses da ficha do personagem)
//   vista=frente|tres_quartos|perfil|costas
//   enquadrar=corpo|rosto        (enquadramento automático)
//   elev=8                       (altura da câmera, em graus)
//   w=1080&h=1920                (tamanho do quadro)
import * as THREE from 'three';
import { RIM, CONTORNO } from '/motor/toon.js';
import { aplicarPose } from '/motor/poses.js';
import { criarEsferaDePoder } from '/efeitos/brilho.js';
import { PALETA } from '/motor/paleta.js';

const q = new URLSearchParams(location.search);
const W = parseInt(q.get('w') || '1080', 10);
const H = parseInt(q.get('h') || '1920', 10);
const nome = q.get('personagem') || 'senhor';
const vista = q.get('vista') || 'frente';
const enquadrar = q.get('enquadrar') || 'corpo';
const elev = parseFloat(q.get('elev') || (enquadrar === 'rosto' ? '2' : '8'));

const mod = await import(`/personagens/${nome}/${nome}.js`);
const FICHA = mod.FICHA;
const personagem = mod.default({ expressao: FICHA.expressaoPadrao });
const poses = personagem.userData.poses || {};
const nomePose = q.get('pose') || 'parado';
const pose = poses[nomePose];
if (!pose) throw new Error(`Pose fora da ficha: "${nomePose}". Oficiais: ${Object.keys(poses).join(', ')}`);
personagem.userData.rosto.definirExpressao(q.get('expressao') || pose.expressao || FICHA.expressaoPadrao);

// Vista por nome ou em graus (ex.: vista=-50).
const giro = { frente: 0, tres_quartos: -0.6, perfil: -Math.PI / 2, costas: Math.PI }[vista]
  ?? THREE.MathUtils.degToRad(parseFloat(vista) || 0);
aplicarPose(personagem, pose, { base: { pos: new THREE.Vector3(), rotY: giro } });

const tela = document.getElementById('tela');
tela.width = W; tela.height = H;
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('gl'), antialias: true, alpha: true, preserveDrawingBuffer: true,
});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
CONTORNO.uResolucao.value.set(W, H);
CONTORNO.uEspessura.value = enquadrar === 'rosto' ? 3 : 2;   // guia 5.4: close = 3 px

const cena = new THREE.Scene();
cena.add(personagem);

// Estúdio neutro: luz principal quente-clara, preenchimento frio, contra-luz para a borda.
cena.add(new THREE.HemisphereLight('#c9d6ea', '#3b3634', 1.1));
const principal = new THREE.DirectionalLight('#fff3e2', 2.4);
principal.position.set(-2.5, 4.5, 9);
principal.castShadow = q.get('sombras') !== '0';
principal.shadow.mapSize.set(2048, 2048);
Object.assign(principal.shadow.camera, { left: -4, right: 4, top: 5, bottom: -2, near: 0.5, far: 25 });
principal.shadow.bias = -0.0005;
cena.add(principal);
RIM.uRimCor.value.set('#9fc2ff');
RIM.uRimDir.value.set(2.5, 1.2, -2).normalize();

// Piso invisível que só recebe a sombra projetada.
const piso = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.22 }));
piso.rotation.x = -Math.PI / 2;
piso.receiveShadow = true;
cena.add(piso);

// Efeito da pose (entre as mãos, um pouco à frente).
let efeito = null;
if (pose.efeito === 'poder') {
  efeito = criarEsferaDePoder({ cor: PALETA.magia, tamanho: 0.34 });
  personagem.updateWorldMatrix(true, true);
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  personagem.getObjectByName('maoE_malha').getWorldPosition(a);
  personagem.getObjectByName('maoD_malha').getWorldPosition(b);
  const frente = new THREE.Vector3(0, 0, 1).applyQuaternion(personagem.quaternion).setY(0).normalize();
  efeito.position.copy(a.add(b).multiplyScalar(0.5)).addScaledVector(frente, 0.3);
  cena.add(efeito);
}

// Enquadramento automático: caixa do corpo (ou da cabeça), câmera na altura "elev".
function caixaDe(obj) {
  const caixa = new THREE.Box3();
  obj.updateWorldMatrix(true, true);
  obj.traverse(o => {
    if (o.isMesh && o.visible && o.name !== 'sombra_contato' && !o.name.endsWith('_contorno')) {
      caixa.expandByObject(o, false);
    }
  });
  return caixa;
}
const alvo = enquadrar === 'rosto' ? personagem.userData.juntas.cabeca : personagem;
const caixa = caixaDe(alvo);
if (enquadrar === 'corpo' && efeito) caixa.expandByPoint(efeito.position.clone().addScalar(0.4)).expandByPoint(efeito.position.clone().addScalar(-0.4));
const centro = caixa.getCenter(new THREE.Vector3());
const tam = caixa.getSize(new THREE.Vector3());
const fov = enquadrar === 'rosto' ? 24 : 30;
const camera = new THREE.PerspectiveCamera(fov, W / H, 0.1, 200);
const tanV = Math.tan(THREE.MathUtils.degToRad(fov / 2));
const margem = enquadrar === 'rosto' ? 1.45 : 1.3;
const larguraVista = Math.max(tam.x, tam.z * 0.6);
const dist = Math.max((tam.y * margem) / (2 * tanV), (larguraVista * margem) / (2 * tanV * (W / H))) + tam.z / 2;
const e = THREE.MathUtils.degToRad(elev);
camera.position.set(centro.x, centro.y + Math.sin(e) * dist, centro.z + Math.cos(e) * dist);
camera.lookAt(centro.x, centro.y - (enquadrar === 'corpo' ? tam.y * 0.02 : 0), centro.z);

const ctx = tela.getContext('2d');
function fundo() {
  const g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.05, W / 2, H * 0.5, Math.max(W, H) * 0.75);
  g.addColorStop(0, '#b4b8bf');
  g.addColorStop(1, '#7c818a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

window.FICHA = JSON.parse(JSON.stringify({
  ...FICHA,
  posesInfo: Object.fromEntries(Object.entries(poses).map(([k, p]) => [k, { titulo: p.titulo || k, ficha: p.ficha || {}, expressao: p.expressao }])),
}));
window.VIDEO = { largura: W, altura: H, fps: 30, duracao: 1 };
window.desenharQuadro = (n) => {
  if (efeito) efeito.userData.atualizar(n / 30 + 0.4);
  fundo();
  renderer.render(cena, camera);
  ctx.drawImage(renderer.domElement, 0, 0);
};
</script>
</body>
</html>
