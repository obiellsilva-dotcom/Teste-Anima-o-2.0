<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="tela" width="1080" height="1920"></canvas>
<script>
window.VIDEO = { largura: 1080, altura: 1920, fps: 30, duracao: 5 };
const W = 1080, H = 1920;
const ctx = document.getElementById('tela').getContext('2d');

const suave = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; // easeInOutCubic

// Partículas de rastro com sementes fixas: o mesmo quadro sempre sai igual.
function aleatorio(semente) { const x = Math.sin(semente * 127.1) * 43758.5453; return x - Math.floor(x); }

window.desenharQuadro = function (n) {
  const t = n / window.VIDEO.fps;
  const p = t / window.VIDEO.duracao;

  // Fundo em degradê
  const fundo = ctx.createLinearGradient(0, 0, 0, H);
  fundo.addColorStop(0, '#1b1f4b');
  fundo.addColorStop(1, '#0b0d24');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = fundo;
  ctx.fillRect(0, 0, W, H);

  // Posição do círculo: atravessa da esquerda para a direita, com leve onda
  const posX = (q) => -160 + (W + 320) * suave(Math.min(Math.max(q, 0), 1));
  const posY = (q) => H * 0.5 + Math.sin(q * Math.PI * 2) * 260;
  const x = posX(p), y = posY(p);

  // Rastro de faíscas
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 1; i <= 24; i++) {
    const q = p - i * 0.006;
    if (q < 0) break;
    const jx = (aleatorio(i + n * 0.01) - 0.5) * 40;
    const jy = (aleatorio(i * 3.7 + n * 0.01) - 0.5) * 40;
    const r = 18 * (1 - i / 26);
    const a = 0.5 * (1 - i / 25);
    const g = ctx.createRadialGradient(posX(q) + jx, posY(q) + jy, 0, posX(q) + jx, posY(q) + jy, r * 2.5);
    g.addColorStop(0, `rgba(255,220,140,${a})`);
    g.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(posX(q) + jx, posY(q) + jy, r * 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // Halo do brilho (pulsando)
  const pulso = 1 + 0.12 * Math.sin(t * Math.PI * 4);
  const halo = ctx.createRadialGradient(x, y, 0, x, y, 340 * pulso);
  halo.addColorStop(0, 'rgba(255,214,120,0.85)');
  halo.addColorStop(0.25, 'rgba(255,170,80,0.35)');
  halo.addColorStop(1, 'rgba(255,120,60,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(x, y, 340 * pulso, 0, Math.PI * 2); ctx.fill();

  // Círculo sólido com brilho
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.shadowColor = 'rgba(255,200,90,1)';
  ctx.shadowBlur = 80;
  const corpo = ctx.createRadialGradient(x - 30, y - 30, 10, x, y, 120);
  corpo.addColorStop(0, '#fffbe6');
  corpo.addColorStop(0.6, '#ffd36b');
  corpo.addColorStop(1, '#ffa53d');
  ctx.fillStyle = corpo;
  ctx.beginPath(); ctx.arc(x, y, 120, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Palavra TESTE no centro, com sombra suave
  const entrada = Math.min(t / 0.6, 1);
  const escala = 0.85 + 0.15 * suave(entrada);
  ctx.save();
  ctx.globalAlpha = entrada;
  ctx.translate(W / 2, H / 2);
  ctx.scale(escala, escala);
  ctx.font = '700 220px Poppins, "DejaVu Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('TESTE', 0, 0);
  ctx.restore();
};
</script>
</body>
</html>
